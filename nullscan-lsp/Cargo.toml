[package]
name = "nullscan-lsp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nullscan-lsp"
path = "src/main.rs"

[dependencies]
env_logger = "0.11.8"
log = "0.4.34"
lsp-server = "0.10"
lsp-types = "0.97"
nullscan-core = { version = "0.1.0", path = "../nullscan-core" }
nullscan-workspace = { version = "0.1.0", path = "../nullscan-workspace" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
